<!-- =====================================================
     MOBILE OVERLAY
===================================================== -->

@if (isOpen) {
  <div class="sidebar-overlay" (click)="onCloseSidebar()"></div>
}

<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar" [class.sidebar-open]="isOpen">
  <!-- ===================================================
       LOGO
  ==================================================== -->

  <div class="sidebar-logo">
    <div class="logo-container">
      <img
        src="images/jqz-homecare-logo.png"
        alt="JQZ By Qalandars - Clinics & Home-Care Services"
        class="logo-image"
      />

      <p class="logo-subtitle">Admin Portal</p>
    </div>
  </div>

  <!-- ===================================================
       NAVIGATION
  ==================================================== -->

  <nav class="sidebar-menu" aria-label="Main navigation">
    @for (item of menuItems; track item.route) {
      <button
        type="button"
        class="menu-item"
        [class.active]="isActive(item.route)"
        [attr.aria-current]="isActive(item.route) ? 'page' : null"
        (click)="onMenuItemClick(item.route)"
      >
        <i [class]="item.icon"></i>

        <span>
          {{ item.label }}
        </span>
      </button>
    }
  </nav>
</aside>
