<!-- =====================================================
     MOBILE OVERLAY
===================================================== -->

@if (isOpen) {
  <div class="sidebar-overlay" aria-hidden="true" (click)="onCloseSidebar()"></div>
}

<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside
  class="sidebar"
  [class.sidebar-open]="isOpen"
  [class.sidebar-collapsed]="isCollapsed"
  [class.sidebar-expanded]="!isCollapsed"
>
  <!-- ===================================================
       SIDEBAR HEADER
  ==================================================== -->

  <div class="sidebar-header">
    <!-- ===============================================
         BRAND
    ================================================ -->

    <div class="sidebar-brand">
      <div class="logo-wrapper">
        <img
          src="images/jqz-homecare-logo.png"
          alt="JQZ By Qalandars - Clinics & Home-Care Services"
          class="logo-image"
        />
      </div>

      <div class="brand-text">
        <span class="brand-title"> JQZ HomeCare </span>

        <span class="brand-subtitle"> Admin Portal </span>
      </div>
    </div>

    <!-- ===============================================
         TABLET / DESKTOP
         SIDEBAR COLLAPSE / EXPAND CONTROL

         ONLY ONE CONTROL
         CHEVRON ONLY
         NO HAMBURGER ICON
    ================================================ -->

    <button
      type="button"
      class="sidebar-toggle"
      [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.title]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
      (click)="toggleSidebar()"
    >
      <i
        class="fa-solid"
        [class.fa-chevron-right]="isCollapsed"
        [class.fa-chevron-left]="!isCollapsed"
      ></i>
    </button>

    <!-- ===============================================
         MOBILE CLOSE BUTTON

         MOBILE ONLY
    ================================================ -->

    <button
      type="button"
      class="mobile-close-button"
      aria-label="Close navigation"
      title="Close navigation"
      (click)="onCloseSidebar()"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <!-- ===================================================
       NAVIGATION
  ==================================================== -->

  <nav class="sidebar-menu" aria-label="Main navigation">
    @for (section of menuSections; track section.label) {
      <div class="menu-section" [class.section-active]="isSectionActive(section.items)">
        <!-- ===========================================
             SECTION TITLE
        ============================================ -->

        <div class="section-title">
          <span>
            {{ section.label }}
          </span>
        </div>

        <!-- ===========================================
             SECTION ITEMS
        ============================================ -->

        <div class="section-items">
          @for (item of section.items; track item.route) {
            <button
              type="button"
              class="menu-item"
              [class.active]="isActive(item.route)"
              [class.collapsed-item]="isCollapsed"
              [attr.aria-current]="isActive(item.route) ? 'page' : null"
              [attr.title]="isCollapsed ? item.label : null"
              (click)="onMenuItemClick(item.route)"
            >
              <!-- ICON -->

              <span class="menu-icon">
                <i [class]="item.icon"></i>
              </span>

              <!-- LABEL -->

              <span class="menu-label">
                {{ item.label }}
              </span>
            </button>
          }
        </div>
      </div>
    }
  </nav>
</aside>
