<!-- Mobile Overlay -->
@if (isOpen) {
  <div class="sidebar-overlay" (click)="onCloseSidebar()"></div>
}

<!-- Sidebar -->
<aside class="sidebar" [class.sidebar-open]="isOpen">
  <!-- Logo -->
  <div class="sidebar-logo">
    <div class="logo-container">
      <div class="logo-icon">
        <i class="fa-solid fa-heart-pulse"></i>
      </div>

      <div class="logo-text">
        <h1>JQZ HomeCare</h1>
        <p>Admin Portal</p>
      </div>
    </div>
  </div>

  <!-- Menu -->
  <nav class="sidebar-menu">
    @for (item of menuItems; track item.label) {
      <button
        type="button"
        class="menu-item"
        [class.active]="item.active"
        (click)="onMenuItemClick()"
      >
        <i [class]="item.icon"></i>

        <span>
          {{ item.label }}
        </span>
      </button>
    }
  </nav>
</aside>
